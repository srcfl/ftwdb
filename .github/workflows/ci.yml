name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo fmt --manifest-path bench/sd-card-emulator/Cargo.toml -- --check
      - run: cargo clippy --manifest-path bench/sd-card-emulator/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path bench/sd-card-emulator/Cargo.toml --all-targets
