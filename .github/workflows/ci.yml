name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo fmt --manifest-path bench/sd-card-emulator/Cargo.toml -- --check
      - run: cargo clippy --manifest-path bench/sd-card-emulator/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path bench/sd-card-emulator/Cargo.toml --all-targets
