[package]
name = "ftw-sd-emulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Deterministic fault-injecting SD-card emulator for FTWDB benchmarks"
license = "Apache-2.0"
publish = false
build = "build.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"

[profile.release]
lto = "thin"
codegen-units = 1
