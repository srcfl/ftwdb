[package]
name = "wattdb"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "An SD-card-conscious embedded time-series engine for energy data"
license = "Apache-2.0"

[dependencies]
crc32fast = "1.5.0"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tempfile = "3.27.0"

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "compare_sqlite"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
