[package]
name = "ftwdb"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Forecasts, Telemetry & Watts: an SD-card-conscious embedded energy database"
license = "Apache-2.0"
repository = "https://github.com/srcfl/ftwdb"

[package.metadata.ftwdb]
support = "Unix targets only; Linux and macOS are tested in CI"

[dependencies]
crc32fast = "1.5.0"
flate2 = "1.1.5"
jiff = "0.2.34"
lz4_flex = "0.14.0"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tempfile = "3.27.0"

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "compare_sqlite"
harness = false

[[bench]]
name = "segment"
harness = false

[[bench]]
name = "rollup"
harness = false

[[bench]]
name = "energy_compare"
harness = false

[[bench]]
name = "model_queries"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
